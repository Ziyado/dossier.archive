/* VOICE  occasion: a design archive you browse with your hands
   IDEA   a steel card cabinet: one drawer per Solution category, black guide cards per subcategory, folders per work
   PICTURE the cabinet, the open drawer of staggered tabs, and each work pinned to a board beside its typed record

   TYPE   Dossier system: Josephine Sans (H1), Gotham Book (H2, H3, IDs), Europa Light (H4, H5, B1, B2)
   LAYOUT title row, cabinet full width, graph index under it; entry = image left, paper and notes right; stacks on phones */

:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:300 16px/1.55 var(--f-edit);overflow-x:clip}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
header.top{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1.5px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px;text-decoration:none;margin-right:auto}
.brand span{font:400 15px/1.3 var(--f-struct);letter-spacing:.07em;text-transform:uppercase;font-size:13px}
.search{position:relative;flex:0 1 340px}
.search input{width:100%;height:44px;border:1.5px solid var(--line);border-radius:22px;background:var(--panel);color:var(--ink);padding:0 16px 0 40px;font:300 16px var(--f-edit)}
.search input:focus{outline:3px solid #1f3fd1;outline-offset:1px}
.search svg{position:absolute;left:14px;top:13px;width:18px;height:18px}
#res{position:absolute;z-index:150;top:50px;left:0;right:0;list-style:none;margin:0;padding:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-height:70vh;overflow:auto}
#res:empty{display:none}
#res a{display:grid;grid-template-columns:auto 1fr;gap:0 10px;padding:8px 10px;border-radius:8px;text-decoration:none}
#res a:hover,#res a:focus{background:var(--well);outline:none}
#res b{grid-row:span 2;min-width:58px;font-size:11px!important;height:36px;border-radius:6px;display:grid;place-items:center;font:500 11px var(--f-struct);font-variant-numeric:tabular-nums;padding:0 6px}
#res small{font:300 10px/1.4 var(--f-edit);letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
#res .none{padding:10px;color:var(--soft);font-size:14px}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;padding:28px 0 18px}
.head h1{font:700 clamp(30px,4vw,36px)/1.1 var(--f-display);letter-spacing:0;margin:0;text-wrap:balance}
.head p{margin:6px 0 0;color:var(--soft);max-width:60ch}
.crumbs{font:300 10px/1.4 var(--f-edit);letter-spacing:.05em;text-transform:uppercase;color:var(--soft);margin-bottom:10px}
.crumbs a{text-decoration:none;border-bottom:1px solid currentColor}
.stats{display:flex;gap:26px;font:300 12px/1.2 var(--f-edit);letter-spacing:.08em;text-transform:uppercase;color:var(--soft);flex-wrap:wrap}
.stats b{display:block;font:700 34px/1 var(--f-display);letter-spacing:0;text-transform:none;color:var(--ink);margin-bottom:4px}
.btn{min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:22px;background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:15px;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn:focus-visible{outline:3px solid #1f3fd1;outline-offset:2px}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
/* cabinet */
.cab{position:relative;margin:24px auto 0;max-width:900px;border:1.5px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:var(--panel);padding:46px clamp(12px,2.6vw,28px) 28px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2.4vw,26px) clamp(12px,2vw,22px)}
.cab::before{content:"";position:absolute;left:-1.5px;right:-1.5px;top:12px;height:14px;border-block:1.5px solid var(--line)}
.plinth{max-width:930px;margin:0 auto 18px;height:26px;border:1.5px solid var(--line);background:var(--well);position:relative}
.plinth::before,.plinth::after{content:"";position:absolute;bottom:-12px;width:34px;height:12px;border:1.5px solid var(--line);border-top:0;background:var(--panel)}
.plinth::before{left:30px}
.plinth::after{right:30px}
.dr{position:relative;display:block;aspect-ratio:1.7;text-decoration:none;outline:none;border-radius:4px;background:var(--well);box-shadow:inset 0 0 0 1.5px var(--line)}
.peek{position:absolute;left:6%;right:6%;top:6px;height:40px;z-index:1;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.peek i{position:absolute;height:16px;width:30%;clip-path:polygon(0 100%,8% 0,92% 0,100% 100%)}
.front{position:absolute;inset:0;z-index:2;border:1.5px solid var(--line);border-radius:4px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px 12px 40px;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.holder{border:1.5px solid var(--line);border-radius:3px;padding:3px;background:var(--well);width:min(86%,300px)}
.card{display:block;background:var(--c);color:var(--t);padding:10px 12px;font:700 clamp(17px,2vw,21px)/1.1 var(--f-display);letter-spacing:.01em;text-align:center;text-wrap:balance}
.front small{font:300 10px/1.4 var(--f-edit);letter-spacing:.05em;text-transform:uppercase;color:var(--soft);text-align:center}
.pull{position:absolute;z-index:3;bottom:12px;left:32%;width:36%;height:16px;border:1.5px solid var(--line);border-radius:0 0 12px 12px;border-top-width:4px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.dr:hover .front,.dr:focus-visible .front{transform:translateY(12px) scale(1.03);box-shadow:0 18px 26px -10px rgba(0,0,0,.35)}
.dr:hover .pull,.dr:focus-visible .pull{transform:translateY(12px)}

.dfront{position:relative;z-index:60;height:120px;border:1.5px solid var(--line);background:var(--panel);border-radius:0 0 6px 6px;display:grid;place-items:center;align-content:center;gap:12px;transition:transform .4s}

const hex2hsl=h=>{let r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let H=0,S=0;if(mx!==mn){const d=mx-mn;S=l>.5?d/(2-mx-mn):d/(mx+mn);H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;H*=60}return[H,S*100,l*100]};
const hsl2hex=(H,S,L)=>{S/=100;L/=100;const k=n=>(n+H/30)%12,a=S*Math.min(L,1-L),f=n=>L-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return"#"+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("")};
const lum=h=>{const c=[1,3,5].map(i=>{const v=parseInt(h.slice(i,i+2),16)/255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*c[0]+.7152*c[1]+.0722*c[2]};

/* n shades of one hue in a shuffled order: evenly spaced tones (so no two look alike), with a little
   random variation in saturation and hue. Seeded by the category name, so the order stays the same on every visit. */
function shades(hex,n,seed){const[H,S,L]=hex2hsl(hex);if(n<=1)return[pair(hex)];const r=rng(hash(seed||hex)+101);
  const lo=Math.max(22,L-30),hi=Math.min(86,L+22),tones=Array.from({length:n},(_,i)=>lo+(hi-lo)*i/(n-1));
  for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[tones[i],tones[j]]=[tones[j],tones[i]]}
  return tones.map(l=>pair(hsl2hex((H+(r()-.5)*12+360)%360,Math.min(100,S*(0.7+r()*0.4)),l+(r()-.5)*4)))}

function build(p){
  const g={p,W:{},E:{},D:{},cats:[],subs:{},types:{},order:[],styles:p.styles||{}};
  (p.entities||[]).forEach(e=>g.E[e.id]=e);
  (p.designers||[]).forEach(d=>g.D[d.id]=d);
  (p.structure||[]).forEach(c=>{g.cats.push(c.name);g.subs[c.name]=c.subs.map(x=>x.name);c.subs.forEach(x=>{g.types[x.name]=x.types?x.types.map(t=>t.name||t):[].concat(...Object.values(x.groups||{}))})});
  (p.works||[]).forEach(w=>{
    w.types=w.types||[];w.path=[w.category,w.subcategory];
    if(!g.subs[w.category]){g.subs[w.category]=[];g.cats.push(w.category)}
    if(!g.subs[w.category].includes(w.subcategory))g.subs[w.category].push(w.subcategory);
    const tl=(g.types[w.subcategory]=g.types[w.subcategory]||[]);w.types.forEach(t=>{if(!tl.includes(t))tl.push(t)});
    w.images=w.images&&w.images.length?w.images:(w.img&&w.img.web?[w.img]:[]);
    w.designers=(Array.isArray(w.designers)?w.designers:String(w.designer||"").split(",")).map(x=>String(x).trim()).filter(Boolean);w.designer=w.designers[0]||"";
    w.leaf=w.types[0]||w.subcategory;w.kind=w.types.length?w.types.join(" + "):w.subcategory;
    w.key=w.id.toLowerCase();g.W[w.key]=w});
  const rank=w=>{const ci=g.cats.indexOf(w.category),si=g.subs[w.category].indexOf(w.subcategory);return ci*1e7+si*1e5+(+w.year||0)};
  g.order=Object.values(g.W).sort((a,b)=>rank(a)-rank(b));
  g.subCol={};
  g.cats.forEach((c,i)=>{const base=CATCOL[c]||CATFALL[i%CATFALL.length];g.cats[i]={name:c,slug:slug(c),col:pair(base)};
    const sh=shades(base,g.subs[c].length,c);g.subs[c].forEach((sub,k)=>g.subCol[sub]=sh[k])});
  Object.values(g.W).forEach(w=>{w.col=g.subCol[w.subcategory]||(g.cats.find(c=>c.name===w.category)||{col:pair("#999999")}).col});
  return g;
}

  const r=rng(hash(w.id)+11+ix*7919),ar=ASPECT[w.leaf]||.71,W=600,H=Math.round(W/ar);
  const mv=MOVES.indexOf(w.movement),c=w.col[0];
  const words=(w.title||"").split(" ");let lines=[""];words.forEach(x=>{if((lines[lines.length-1]+" "+x).length>(ar>1.2?22:16))lines.push(x);else lines[lines.length-1]=(lines[lines.length-1]+" "+x).trim()});lines=lines.slice(0,3);
  const fs=Math.min(64,W/ (Math.max(...lines.map(l=>l.length))*0.55+2));
  let s="",bg,ink,font;
  if(mv===0){bg="#efe6cf";ink="#2a2018";font="Georgia,serif";
    for(let i=0;i<22;i++){const a=Math.PI*(i/21);s+=`<path d="M${W/2} ${H*.95} L${W/2-Math.cos(a)*W} ${H*.95-Math.sin(a)*W}" stroke="#c49a3a" stroke-width="5" opacity=".55"/>`}
    s+=`<circle cx="${W/2}" cy="${H*.95}" r="${W*.2}" fill="${c}"/><rect x="18" y="18" width="${W-36}" height="${H-36}" fill="none" stroke="${ink}" stroke-width="4"/><rect x="30" y="30" width="${W-60}" height="${H-60}" fill="none" stroke="${ink}" stroke-width="1.5"/>`;
  }else if(mv===2){bg=["#f3a6c0","#9fe0c8","#f6e27a"][hash(w.id)%3];ink="#121212";font="Arial Black,Helvetica,sans-serif";
    for(let i=0;i<26;i++){const x=r()*W,y=r()*H,k=r();s+=k<.33?`<path d="M${x} ${y} l20 -34 l20 34z" fill="${PAL[i%8][0]}"/>`:k<.66?`<path d="M${x} ${y} q12 -18 24 0 t24 0 t24 0" fill="none" stroke="#121212" stroke-width="5"/>`:`<circle cx="${x}" cy="${y}" r="${6+r()*14}" fill="${PAL[(i+3)%8][0]}"/>`}
  }else{bg=c;ink=w.col[1];font="Helvetica,Arial,sans-serif";
    for(let i=0;i<5;i++)s+=`<circle cx="${W*(.25+r()*.6)}" cy="${H*(.15+r()*.45)}" r="${W*(.08+r()*.2)}" fill="${PAL[(hash(w.id)+i*3)%8][0]}" opacity=".9" style="mix-blend-mode:multiply"/>`;
    s+=`<rect x="0" y="${H*.72}" width="${W}" height="6" fill="${ink}"/>`}
  if(/Photo/.test(w.designStyle||"")){let x=0;while(x<W){const bw=50+r()*80,bh=H*(.25+r()*.4);const gr=70+Math.floor(r()*90);s+=`<rect x="${x}" y="${H*.72-bh}" width="${bw}" height="${bh}" fill="rgb(${gr},${gr},${gr})"/>`;x+=bw+6}}
  if(w.leaf==="Vinyl Record Label"){bg="#121212";s=`<circle cx="300" cy="300" r="290" fill="#1c1c1c"/><circle cx="300" cy="300" r="170" fill="${c}"/><circle cx="300" cy="300" r="10" fill="#121212"/>`;ink=w.col[1];}
  if(w.leaf==="Currency"){for(let i=0;i<16;i++)s+=`<ellipse cx="${W*.72}" cy="${H/2}" rx="${H*.36}" ry="${H*.13}" transform="rotate(${i*11.25} ${W*.72} ${H/2})" fill="none" stroke="${c}" stroke-width="1.4" opacity=".7"/>`;s+=`<text x="${W*.72}" y="${H/2+22}" font-family="Georgia,serif" font-size="70" text-anchor="middle" fill="${ink}">10</text>`}
  const ty=w.leaf==="Vinyl Record Label"?300-lines.length*fs*.45:mv===1?H*.8:H*.42-lines.length*fs*.4,tx=mv===1?40:W/2,anchor=mv===1?"start":"middle";
  const txt=lines.map((l,i)=>`<text x="${tx}" y="${ty+(i+1)*fs*1.05}" font-family="${font}" font-weight="${mv===0?400:700}" font-size="${fs}" text-anchor="${anchor}" fill="${ink}"${mv===2?` transform="rotate(-6 ${W/2} ${H/2})"`:""}>${esc(l)}</text>`).join("");
  let body=`<rect width="${W}" height="${H}" fill="${bg}"/>${s}${txt}<text x="${W-24}" y="${H-22}" font-family="Courier New,monospace" font-size="18" text-anchor="end" fill="${ink}" opacity=".7">${esc(w.id)} · ${esc(w.year)}</text>`;
  if(w.leaf==="Postage"){let p="";for(let x=0;x<=W;x+=24)p+=`<circle cx="${x}" cy="0" r="8"/><circle cx="${x}" cy="${H}" r="8"/>`;for(let y=0;y<=H;y+=24)p+=`<circle cx="0" cy="${y}" r="8"/><circle cx="${W}" cy="${y}" r="8"/>`;body+=`<g fill="#fbfaf6">${p}</g>`}
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${body}</svg>`);
}

/* lay a guide's papers out as a grid that fits the drawer width, and lift the guides below by exactly its height */
function openGuide(g){
  const wrap=g.querySelector(".papers"),tray=g.closest(".tray");if(!tray)return;
  if(wrap){const ps=[...wrap.children],W=wrap.clientWidth,pw=ps[0]?ps[0].offsetWidth:150,gap=W<420?10:16,per=Math.max(1,Math.floor((W+gap)/(pw+gap)));
    const ph=Math.max(...ps.map(p=>p.offsetHeight),180);
    ps.forEach((p,k)=>{p.style.setProperty("--gx",(k%per)*(pw+gap)+"px");p.style.setProperty("--gy",Math.floor(k/per)*(ph+gap)+"px")});
    wrap.style.setProperty("--ph",Math.ceil(ps.length/per)*(ph+gap)+"px")}
  requestAnimationFrame(()=>{const body=g.querySelector(".body");const need=32+(wrap?wrap.offsetTop+parseFloat(getComputedStyle(wrap).getPropertyValue("--ph"))+24:body.offsetHeight)-46;tray.style.setProperty("--lift",Math.max(need,60)+"px")});
}
function closeGuide(g){const wrap=g.querySelector(".papers");if(wrap)wrap.style.removeProperty("--ph")}
function wireGuides(){
  view.querySelectorAll(".guide").forEach(g=>{
    g.addEventListener("pointerenter",()=>openGuide(g));
    g.addEventListener("focusin",()=>openGuide(g));
    g.addEventListener("pointerleave",()=>{if(!g.contains(document.activeElement))closeGuide(g)});
    g.addEventListener("focusout",e=>{if(!g.contains(e.relatedTarget)&&!g.matches(":hover"))closeGuide(g)});
  });
}

    <article class="sheet"><span class="stamp">File ${esc(w.id)}</span><h1>${esc(w.title)}</h1>
     <dl class="meta"><dt>Year</dt><dd>${esc(w.year||"—")}</dd><dt>Country</dt><dd>${esc(w.country||"—")}</dd><dt>Category</dt><dd><a href="#drawer-${c.slug}">${esc(w.category)}</a></dd><dt>Subcategory</dt><dd>${esc(w.subcategory)}</dd>${w.types.length?`<dt>Type${w.types.length>1?"s":""}</dt><dd>${w.types.map(t=>`<a href="#kind-${slug(t)}">${esc(t)}</a>`).join(", ")}</dd>`:""}<dt>Size</dt><dd>${esc(w.dims||"—")}</dd>${w.credit?`<dt>Credit</dt><dd>${esc(w.credit)}</dd>`:""}</dl>
     <h2>Intent</h2><p>${esc(w.intent||"Not recorded.")}</p>${w.notes?`<h2>Notes</h2><p>${esc(w.notes)}</p>`:""}</article>
    <div class="notes">
     <div class="sn" style="background:#f2d54a;--r:-1.5deg"><small>Designer${w.designers.length>1?"s":""}</small>${w.designers.length?w.designers.map(id=>{const x=G.D[id];return x?`<a class="dline" href="#designer-${slug(x.id)}"><b>${esc(x.name)}</b><span>${esc([x.kind,x.years&&"active "+x.years].filter(Boolean).join(", "))} · ${G.order.filter(o=>o.designers.includes(x.id)).length} works →</span></a>`:`<b>${esc(id)}</b><span>Not listed on the Designers tab</span>`}).join(""):"<b>Unknown</b>"}</div>
     <a class="sn" style="background:#ef9ab8;--r:1.2deg" href="${e?`#entity-${slug(e.id)}`:"#cabinet"}"><small>Entity</small><b>${esc(e?e.name:"Unknown")}</b><span>${esc(e?e.type:"")}</span><em>${e?G.order.filter(x=>x.entity===e.id).length+" works →":""}</em></a>
     <div class="sn" style="background:#9fd8b6;--r:.8deg"><small>Design philosophy</small><b><a href="#movement-${slug(w.movement)}" style="color:inherit">${esc(w.movement)}</a></b><span class="tags">${w.designStyle?`<a href="#style-${slug(w.designStyle)}">${esc(w.designStyle)}</a>`:""}${w.typeStyle?`<a href="#typo-${slug(w.typeStyle)}">${esc(w.typeStyle)}</a>`:""}</span></div>
     <div class="sn" style="background:#bcccff;--r:-1deg"><small>Solution</small><b><a href="#drawer-${c.slug}" style="color:inherit">${esc(w.subcategory)}</a></b><span>${esc(w.category)}</span><span class="tags">${w.types.map(t=>`<a href="#kind-${slug(t)}">${esc(t)}</a>`).join("")}</span></div>
    </div>
    <div class="gcard"><h2>How it connects</h2>${graphSVG(w)}</div>
   </div></div>
   ${rel.length?`<div class="rel"><h2>Connected works</h2><div class="relrow">${rel.map(([x,why])=>`<a href="#work-${x.key}" style="--c:${x.col[0]}"><img loading="lazy" alt="" data-w="${x.key}" src="${esc(imgThumb(x))}"><b>${esc(x.title)}</b><small>${why} · ${esc(x.year)}</small></a>`).join("")}</div></div>`:""}
  </div>`;
  workEl.classList.add("on");document.body.style.overflow="hidden";workEl.scrollTop=0;
  let cur=0;
  const show=k=>{cur=(k+n)%n;const m=w.images[cur]||{},img=$("#mainImg"),full=okUrl(m.full);
    img.dataset.i=cur;delete img.dataset.fell;img.src=imgWeb(w,cur);
    const fb=$("#fullBtn");fb.href=full||"#";fb.setAttribute("aria-disabled",String(!full));
    const px=m.w&&m.h?`original ${m.w} × ${m.h} px`:"";
    $("#imgCap").textContent=(n>1?`Image ${cur+1} of ${n}`:"")+(m.caption?(n>1?": ":"")+m.caption:"")+(okUrl(m.web)?((n>1||m.caption)?" · ":"")+"web copy shown"+(px?", "+px:""):((n>1||m.caption)?" · ":"")+"drawn placeholder, no image linked yet")+".";
    workEl.querySelectorAll(".th").forEach(b=>{const on=+b.dataset.k===cur;b.classList.toggle("on",on);b.setAttribute("aria-selected",on)})};
  workEl.querySelectorAll(".th").forEach(b=>b.addEventListener("click",()=>show(+b.dataset.k)));
  const pv=workEl.querySelector(".imgnav.prev"),nx=workEl.querySelector(".imgnav.next");
  if(pv){pv.addEventListener("click",()=>show(cur-1));nx.addEventListener("click",()=>show(cur+1))}
  show(0);
  return true;
}
function closeEntry(){workEl.classList.remove("on");workEl.innerHTML="";document.body.style.overflow=""}

function route(){
  if(!G)return;
  const h=location.hash.slice(1)||"cabinet";
  if(h.startsWith("work-")&&entry(h.slice(5)))return;
  closeEntry();lastView=h;
  const m=h.match(/^(drawer|designer|entity|movement|style|typo|kind)-(.+)$/);
  if(!m)cabinet();else if(m[1]==="drawer")drawer(m[2]);else nodePage(m[1],m[2]);
  scrollTo(0,0);
}
addEventListener("hashchange",route);
addEventListener("keydown",e=>{
  if(e.target.matches("input"))return;
  const h=location.hash.slice(1);
  if(e.key==="Escape"){if(workEl.classList.contains("on"))location.hash=lastView;else if(h&&h!=="cabinet")location.hash="cabinet"}
  if(workEl.classList.contains("on")&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const a=workEl.querySelectorAll(".fbar .btn")[e.key==="ArrowRight"?1:0];if(a)location.hash=a.getAttribute("href").slice(1)}
});

/* ---------- search ---------- */
const q=$("#q"),res=$("#res");
q.addEventListener("input",()=>{
  const v=q.value.trim().toLowerCase();if(!v||!G){res.innerHTML="";return}
  const hit=s=>String(s||"").toLowerCase().includes(v);
  const items=[];
  Object.values(G.D).filter(d=>hit(d.name)).slice(0,3).forEach(d=>items.push([`#designer-${slug(d.id)}`,"Designer",d.name,d.kind+" · "+d.years,["#f2d54a","#121212"]]));
  Object.values(G.E).filter(x=>hit(x.name)).slice(0,3).forEach(x=>items.push([`#entity-${slug(x.id)}`,"Client",x.name,x.type,["#ef9ab8","#121212"]]));
  G.order.filter(w=>[w.title,w.id,w.kind,w.subcategory,w.category,w.designStyle,w.typeStyle,w.movement,w.country,w.year,(G.E[w.entity]||{}).name,...w.designers.map(id=>(G.D[id]||{}).name)].some(hit)).slice(0,8).forEach(w=>items.push([`#work-${w.key}`,w.id,w.title,w.kind+" · "+w.year,w.col]));
  res.innerHTML=items.length?items.map(i=>`<li><a href="${esc(i[0])}"><b style="background:${i[4][0]};color:${i[4][1]}">${esc(i[1])}</b><span>${esc(i[2])}</span><small>${esc(i[3])}</small></a></li>`).join(""):`<li class="none">Nothing filed under “${esc(q.value)}”.</li>`;
});
const clearQ=()=>{q.value="";res.innerHTML=""};
res.addEventListener("click",e=>{if(e.target.closest("a"))clearQ()});
q.addEventListener("keydown",e=>{if(e.key==="Escape"){clearQ();q.blur()}if(e.key==="Enter"){const a=res.querySelector("a");if(a){location.hash=a.getAttribute("href").slice(1);clearQ()}}});

/* ---------- load ---------- */
async function load(){
  let p=null,msg="";
  if(DATA_URL){try{const r=await fetch(DATA_URL,{cache:"no-store"});if(!r.ok)throw new Error(r.status);p=await r.json();msg=`Live from Google Sheets · updated ${new Date(p.updated).toLocaleString()}`}catch(err){msg="Couldn't read the Google Sheet feed, so these are the sample records. Check that the Apps Script web app is deployed with access set to Anyone."}}
  if(!p){p=SAMPLE;msg=msg||"Showing the 24 sample records from the Google Sheet. Images are drawn placeholders until scans are linked."}
  G=build(p);$("#src").textContent=msg;route();
}
load();
}
</script>
</body>
</html>
