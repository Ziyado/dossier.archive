<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Ephemera Cabinet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE  occasion: a design archive you browse with your hands
   IDEA   a steel card cabinet: one drawer per Solution category, black guide cards per subcategory, folders per work
   PICTURE the cabinet, the open drawer of staggered tabs, and each work pinned to a board beside its typed record
   COLOUR warm paper-grey ground, black line ink, folders in cobalt, vermilion, green, plum, yellow, pink
   TYPE   Instrument Serif for labels and titles, Newsreader for records, Plex Mono for typed fields
   LAYOUT title row, cabinet full width, graph index under it; entry = image left, paper and notes right; stacks on phones */
:root{color-scheme:light dark;--bg:light-dark(#e8e6df,#151514);--ink:light-dark(#121212,#ece9e1);--soft:light-dark(#5d5a53,#a8a49b);--panel:light-dark(#f3f1eb,#1f1e1c);--well:light-dark(#d9d6cd,#0e0e0d);--line:light-dark(#121212,#d9d5cb)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
header.top{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1.5px solid var(--line);flex-wrap:wrap}
.brand{font:400 24px/1 "Instrument Serif",serif;text-decoration:none;margin-right:auto}
.brand span{display:inline-block;background:#f2d54a;color:#121212;font:500 13px/1 "IBM Plex Mono",monospace;padding:5px 7px;border-radius:4px;margin-left:8px;vertical-align:3px}
.search{position:relative;flex:0 1 340px}
.search input{width:100%;height:44px;border:1.5px solid var(--line);border-radius:22px;background:var(--panel);color:var(--ink);padding:0 16px 0 40px;font:16px "IBM Plex Sans",sans-serif}
.search input:focus{outline:3px solid #1f3fd1;outline-offset:1px}
.search svg{position:absolute;left:14px;top:13px;width:18px;height:18px}
#res{position:absolute;z-index:150;top:50px;left:0;right:0;list-style:none;margin:0;padding:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-height:70vh;overflow:auto}
#res:empty{display:none}
#res a{display:grid;grid-template-columns:auto 1fr;gap:0 10px;padding:8px 10px;border-radius:8px;text-decoration:none}
#res a:hover,#res a:focus{background:var(--well);outline:none}
#res b{grid-row:span 2;min-width:58px;font-size:11px!important;height:36px;border-radius:6px;display:grid;place-items:center;font:500 12px "IBM Plex Mono",monospace;padding:0 6px}
#res small{color:var(--soft);font-size:13px}
#res .none{padding:10px;color:var(--soft);font-size:14px}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;padding:28px 0 18px}
.head h1{font:400 clamp(36px,5vw,52px)/1.05 "Instrument Serif",serif;letter-spacing:-.02em;margin:0;text-wrap:balance}
.head p{margin:6px 0 0;color:var(--soft);max-width:60ch}
.crumbs{font-size:14px;color:var(--soft);margin-bottom:8px}
.crumbs a{text-decoration:none;border-bottom:1px solid currentColor}
.stats{display:flex;gap:26px;font-size:14px;color:var(--soft);flex-wrap:wrap}
.stats b{display:block;font:400 34px/1 "Instrument Serif",serif;color:var(--ink)}
.btn{min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:22px;background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:15px;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn:focus-visible{outline:3px solid #1f3fd1;outline-offset:2px}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
/* cabinet */
.cab{position:relative;margin:24px auto 0;max-width:900px;border:1.5px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:var(--panel);padding:46px clamp(12px,2.6vw,28px) 28px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2.4vw,26px) clamp(12px,2vw,22px)}
.cab::before{content:"";position:absolute;left:-1.5px;right:-1.5px;top:12px;height:14px;border-block:1.5px solid var(--line)}
.plinth{max-width:930px;margin:0 auto 18px;height:26px;border:1.5px solid var(--line);background:var(--well);position:relative}
.plinth::before,.plinth::after{content:"";position:absolute;bottom:-12px;width:34px;height:12px;border:1.5px solid var(--line);border-top:0;background:var(--panel)}
.plinth::before{left:30px}
.plinth::after{right:30px}
.dr{position:relative;display:block;aspect-ratio:1.7;text-decoration:none;outline:none;border-radius:4px;background:var(--well);box-shadow:inset 0 0 0 1.5px var(--line)}
.peek{position:absolute;left:6%;right:6%;top:6px;height:40px;z-index:1;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.peek i{position:absolute;height:16px;width:30%;clip-path:polygon(0 100%,8% 0,92% 0,100% 100%)}
.front{position:absolute;inset:0;z-index:2;border:1.5px solid var(--line);border-radius:4px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px 12px 40px;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.holder{border:1.5px solid var(--line);border-radius:3px;padding:3px;background:var(--well);width:min(86%,300px)}
.card{display:block;background:var(--c);color:var(--t);padding:8px 12px;font:400 clamp(17px,2.2vw,22px)/1.1 "Instrument Serif",serif;text-align:center;text-wrap:balance}
.front small{font-size:13px;color:var(--soft);text-align:center}
.pull{position:absolute;z-index:3;bottom:12px;left:32%;width:36%;height:16px;border:1.5px solid var(--line);border-radius:0 0 12px 12px;border-top-width:4px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.dr:hover .front,.dr:focus-visible .front{transform:translateY(12px) scale(1.03);box-shadow:0 18px 26px -10px rgba(0,0,0,.35)}
.dr:hover .pull,.dr:focus-visible .pull{transform:translateY(12px)}
.dr:hover .peek,.dr:focus-visible .peek{transform:translateY(-30px)}
.dr:focus-visible .front{outline:3px solid #1f3fd1;outline-offset:3px}
.gindex{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;padding:16px 0 44px}
.gindex section{background:var(--panel);border:1.5px solid var(--line);border-radius:4px;padding:16px 18px 10px;border-top:5px solid var(--c)}
.gindex h2{font:400 26px/1.1 "Instrument Serif",serif;margin:0 0 8px}
.gindex a{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 20%,transparent);text-decoration:none;font-size:15px}
.gindex a:hover span:first-child{text-decoration:underline}
.gindex small{color:var(--soft);font-size:13px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0}
.chip{font-size:13px;border:1px solid var(--line);border-radius:14px;padding:3px 10px;text-decoration:none;white-space:nowrap;background:var(--panel)}
.chip:hover{background:var(--ink);color:var(--bg)}
.chip.off{opacity:.45}
.gindex .chip{display:inline-block;padding:3px 10px;border:1px solid var(--line);font-size:13px}
/* drawer stack */
.drawer{max-width:1040px;margin:6px auto 44px}
.tray{position:relative;padding:22px clamp(10px,2vw,22px) 0;background:var(--well);border:1.5px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0}
.folder{position:relative;display:block;width:100%;height:182px;margin-top:-136px;padding:0;border:0;background:none;text-align:left;cursor:pointer;transition:transform .4s cubic-bezier(.2,.8,.2,1);animation:rise .6s both cubic-bezier(.2,.8,.2,1);animation-delay:calc(min(var(--i),20)*30ms);text-decoration:none;color:inherit;outline:none}
.folder:first-child{margin-top:0}
.folder:last-child{margin-bottom:-62px}
.tab{position:absolute;top:0;left:var(--x);width:var(--w,31%);height:33px;background:var(--c);color:var(--t);clip-path:polygon(0 100%,4% 0,96% 0,100% 100%);display:flex;align-items:center;gap:8px;padding:0 5.5%;white-space:nowrap}
.tab em{flex:none;font:500 12.5px "IBM Plex Mono",monospace;font-style:normal;opacity:.85}
.tab span{font:400 18px/1 "Instrument Serif",serif;overflow:hidden;text-overflow:ellipsis}
.body{position:absolute;top:32px;left:0;right:0;bottom:0;background:var(--c);color:var(--t);border-radius:3px 3px 0 0;box-shadow:0 -3px 8px -2px rgba(0,0,0,.28);padding:14px clamp(12px,2.4vw,24px);display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:4px 20px;align-content:start;align-items:start}
.body .thumb{width:84px;height:104px;object-fit:contain;background:rgba(255,255,255,.14);padding:4px;border-radius:2px}
.body .mono{font:400 13px/1.5 "IBM Plex Mono",monospace;white-space:nowrap}
.body p{margin:0;font-size:15px;line-height:1.4;max-width:56ch}
.body p b{display:block;font:400 21px/1.15 "Instrument Serif",serif;margin-bottom:3px}
.body>*{opacity:0;transition:opacity .25s}
.folder:is(:hover,:focus-visible) .body>*,.folder:last-child .body>*{opacity:1}
.open{font-size:13px;border:1px solid currentColor;border-radius:12px;padding:1px 9px;white-space:nowrap;opacity:0;transition:opacity .3s}
.folder:is(:hover,:focus-visible) ~ .folder{transform:translateY(116px)}
.folder:is(:hover,:focus-visible){transform:translateY(-6px)}
.folder:is(:hover,:focus-visible) .open{opacity:1}
.folder:last-child:not(:hover):not(:focus-visible) .open{opacity:0}
.folder:focus-visible .tab{outline:3px solid #f2d54a}
.guide .tab{background:#121212;color:#f4f1e8;--w:24%}
.guide .body{background:#cfccc3;color:#121212;grid-template-columns:minmax(0,1fr);cursor:default;padding-top:10px}
.guide.empty .tab{opacity:.55}
.guide .body .chips{padding:0}
.guide .chip{background:#f4f1e8;border-color:#121212;color:#121212}
.guide .body{bottom:auto;min-height:150px;align-content:start;padding-bottom:18px}
.guide:not(:hover):not(:focus-within) .body{max-height:150px;overflow:hidden}
.guide:last-child:not(:hover):not(:focus-within) .body>*{opacity:0}
.papers{position:relative;display:block;height:var(--ph,210px);margin-top:12px;transition:height .45s}
.paper{position:absolute;top:16px;left:calc(var(--k)*12px);width:150px;background:#fbfaf6;color:#121212;padding:8px 8px 10px;text-decoration:none;border-top:4px solid var(--c,#121212);box-shadow:0 10px 18px -10px rgba(0,0,0,.6);transform:rotate(var(--r));transition:left .5s cubic-bezier(.2,.8,.2,1),top .5s,transform .25s;z-index:calc(10 - var(--k))}
.paper img{display:block;width:100%;height:104px;object-fit:contain;background:#ecebe6}
.paper em{display:block;font:500 11px/1.4 "IBM Plex Mono",monospace;font-style:normal;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:400 15px/1.15 "Instrument Serif",serif}
.paper.more{height:160px;display:grid;place-content:center;text-align:center;background:#121212;color:#f4f1e8}
.guide:is(:hover,:focus-within) .paper{top:var(--gy,0px);left:var(--gx,0px);transform:rotate(0)}
.guide .paper:is(:hover,:focus-visible){transform:rotate(0) translateY(-10px);z-index:20;outline:none}
.guide .paper:focus-visible{box-shadow:0 0 0 3px #1f3fd1}
.guide:is(:hover,:focus-within) ~ .folder{transform:translateY(var(--lift,270px))}
.tray{transition:padding-bottom .4s cubic-bezier(.2,.8,.2,1)}
.tray:has(.guide:is(:hover,:focus-within)){padding-bottom:var(--lift,270px)}
.tray:has(.guide:is(:hover,:focus-within)) + .dfront{transform:none!important}
.drawer:has(.guide:is(:hover,:focus-within)){padding-bottom:0!important}
.guide .body .chips a.chip{color:#121212}
.dfront{position:relative;z-index:60;height:120px;border:1.5px solid var(--line);background:var(--panel);border-radius:0 0 6px 6px;display:grid;place-items:center;align-content:center;gap:12px;transition:transform .4s}
.tray:has(.folder:is(:hover,:focus-visible)) + .dfront{transform:translateY(116px)}
.drawer:has(.folder:is(:hover,:focus-visible)){padding-bottom:116px}
.dfront .pull{position:static;width:180px;height:18px}
.dfront .holder{width:min(80%,340px)}
@keyframes rise{from{transform:translateY(60px);opacity:0}}
/* entry */
#work{position:fixed;inset:0;z-index:100;background:#141414;color:#ece9e1;overflow:auto;display:none}
#work.on{display:block}
.fbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px max(4vw,16px);background:#141414ee;backdrop-filter:blur(6px);flex-wrap:wrap;border-bottom:1px solid #2c2b28}
.fbar .crumbs{margin:0 auto 0 0;color:#a8a49b}
#work .btn{background:#1f1e1c;border-color:#5a5750;color:#ece9e1}
#work .btn:hover{background:#ece9e1;color:#141414}
.entry{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,3vw,40px);align-items:start;padding:26px 0 50px}
.plate{position:sticky;top:78px;background:var(--c);border-radius:6px;padding:clamp(16px,3vw,34px);display:grid;gap:16px}
.mount{position:relative;background:#fbfaf6;padding:clamp(10px,1.6vw,18px);box-shadow:0 18px 34px -16px rgba(0,0,0,.6);transform:rotate(-.5deg)}
.mount img{display:block;width:100%;height:auto;max-height:min(70vh,760px);object-fit:contain;margin:0 auto}
.mount i{position:absolute;width:26px;height:26px;background:#1a1916;clip-path:polygon(0 0,100% 0,0 100%)}
.mount i:nth-of-type(2){right:0;top:0;transform:scaleX(-1)}
.mount i:nth-of-type(3){left:0;bottom:0;transform:scaleY(-1)}
.mount i:nth-of-type(4){right:0;bottom:0;transform:scale(-1)}
.mount i:nth-of-type(1){left:0;top:0}
.plate .row{display:flex;gap:8px;flex-wrap:wrap}
.plate .btn{background:#f4f1e8!important;color:#121212!important;border-color:#121212!important}
.plate .btn:hover{background:#121212!important;color:#f4f1e8!important}
.plate small{color:var(--t);font-size:13px;opacity:.9}
.imgnav{position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;border:1.5px solid #121212;background:#fbfaf6;color:#121212;font:400 26px/1 "Instrument Serif",serif;cursor:pointer;opacity:.9}
.imgnav:hover,.imgnav:focus-visible{background:#121212;color:#fbfaf6;outline:none}
.imgnav.prev{left:-14px}
.imgnav.next{right:-14px}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px;scroll-snap-type:x mandatory}
.th{flex:none;width:72px;height:72px;padding:4px;background:#fbfaf6;border:2px solid transparent;cursor:pointer;scroll-snap-align:start;opacity:.75}
.th img{width:100%;height:100%;object-fit:contain;display:block}
.th.on{border-color:#121212;opacity:1}
.th:hover,.th:focus-visible{opacity:1;outline:none;border-color:#121212}
.count{position:absolute;right:6px;top:6px;background:#121212;color:#f4f1e8;font:500 11px/1 "IBM Plex Mono",monospace;padding:4px 6px;border-radius:9px}
.right{display:grid;gap:22px}
.sheet{position:relative;background:#f4f1e8 repeating-linear-gradient(#0000 0 27px,#cfd6e6 27px 28px) 0 150px/100% 100% no-repeat;color:#1a1916;padding:34px 30px 30px 58px;box-shadow:0 20px 40px -18px rgba(0,0,0,.7);border-radius:2px}
.sheet::before{content:"";position:absolute;left:20px;top:40px;bottom:40px;width:12px;background:radial-gradient(circle,#141414 4.5px,#0000 5px) 0 0/12px 33.3% repeat-y}
.sheet::after{content:"";position:absolute;left:44px;top:0;bottom:0;border-left:1.5px solid #e9a0a8}
.sheet h1{font:italic 400 clamp(34px,4vw,48px)/1.02 "Instrument Serif",serif;margin:0 0 18px;padding-right:90px;text-wrap:balance}
.stamp{position:absolute;right:20px;top:22px;border:1.5px solid #3e4fbf;color:#3e4fbf;font:500 12px "IBM Plex Mono",monospace;padding:3px 7px;transform:rotate(3deg);white-space:nowrap}
.meta{font:400 13px/1.55 "IBM Plex Mono",monospace;display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;margin:0 0 20px}
.meta dt{color:#6f6a5f}
.meta dd{margin:0}
.meta a{text-decoration-color:#9aa3c8}
.sheet h2{font:400 24px/1 "Instrument Serif",serif;margin:18px 0 6px}
.sheet p{font:400 17px/28px "Newsreader",Georgia,serif;margin:0}
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.sn{position:relative;display:block;color:#121212;text-decoration:none;padding:16px 16px 14px;box-shadow:0 14px 22px -12px rgba(0,0,0,.7);transform:rotate(var(--r));transition:transform .25s}
.sn:hover,.sn:focus-visible{transform:rotate(0) translateY(-4px);outline:none}
.sn:focus-visible{box-shadow:0 0 0 3px #f2d54a}
.sn::before{content:"";position:absolute;left:50%;top:-9px;width:70px;height:18px;margin-left:-35px;background:rgba(255,255,255,.55);transform:rotate(-3deg)}
.sn small{font:500 12px "IBM Plex Mono",monospace;opacity:.75}
.sn b{display:block;font:400 25px/1.05 "Instrument Serif",serif;margin:4px 0 6px}
.sn span{display:block;font-size:14px;line-height:1.4}
.sn em{display:block;font:500 12.5px "IBM Plex Mono",monospace;font-style:normal;margin-top:8px}
.sn .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sn .tags a{font-size:12.5px;border:1px solid #121212;border-radius:10px;padding:1px 8px;text-decoration:none;color:#121212}
.sn .tags a:hover{background:#121212;color:#f4f1e8}
.gcard{background:#fbfaf6;color:#1a1916;border-top:5px solid #e2462a;padding:14px 16px 10px;box-shadow:0 14px 26px -14px rgba(0,0,0,.6)}
.gcard h2{font:400 22px "Instrument Serif",serif;margin:0}
.gcard svg{display:block;width:100%;height:auto}
.gcard a:hover rect{stroke-width:2.5}
.rel h2{font:400 28px "Instrument Serif",serif;margin:0 0 10px}
.relrow{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px}
.relrow a{flex:none;width:170px;scroll-snap-align:start;text-decoration:none;color:#ece9e1}
.relrow img{display:block;width:170px;height:150px;object-fit:contain;background:#26241f;padding:8px;border-top:4px solid var(--c)}
.relrow b{display:block;font:400 17px/1.15 "Instrument Serif",serif;margin-top:6px}
.relrow small{font-size:13px;color:#a8a49b}
.note{background:#f2d54a;color:#121212;padding:10px 14px;border-radius:3px;font-size:14px;margin:12px 0 0}
footer{border-top:1.5px solid var(--line);padding:18px 0 30px;font-size:14px;color:var(--soft);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
kbd{font:500 12px "IBM Plex Mono",monospace;border:1px solid var(--soft);border-radius:4px;padding:1px 5px}
@media(max-width:900px){.entry{grid-template-columns:minmax(0,1fr)}.plate{position:relative;top:0}.gindex{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.paper{width:calc(50% - 6px)}.paper img{height:90px}.cab{grid-template-columns:minmax(0,1fr)}.dr{aspect-ratio:2.3}.tab{--w:56%!important}.tab[data-p="1"]{--x:42%!important}.tab[data-p="2"]{--x:20%!important}.guide .tab{--x:2%!important}.body{grid-template-columns:auto minmax(0,1fr)}.body .mono,.body .open{display:none}.notes{grid-template-columns:minmax(0,1fr)}.sheet{padding:28px 18px 24px 48px}.sheet::after{left:38px}.sheet::before{left:14px}.stamp{position:static;display:inline-block;margin-bottom:10px}.sheet h1{padding-right:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#cabinet">The Ephemera Cabinet<span>Index</span></a>
    <div class="search" role="search">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="8.5" r="6"/><path d="m13 13 5 5"/></svg>
      <input id="q" type="search" placeholder="Search works, designers, clients, styles" autocomplete="off" aria-label="Search the archive">
      <ul id="res"></ul>
    </div>
  </header>
  <main id="view"><p class="head">Opening the cabinet…</p></main>
  <footer><span id="src">Loading records…</span><span>Hover a drawer or tab, click to open · <kbd>←</kbd> <kbd>→</kbd> to leaf · <kbd>Esc</kbd> to go back</span></footer>
</div>
<section id="work" role="dialog" aria-modal="true" aria-label="Archive entry"></section>

<script>

  (p.works||[]).forEach(w=>{

    if(!g.subs[w.category]){g.subs[w.category]=[];g.cats.push(w.category)}

/* lay a guide's papers out as a grid that fits the drawer width, and lift the guides below by exactly its height */
function openGuide(g){
  const wrap=g.querySelector(".papers"),tray=g.closest(".tray");if(!tray)return;
  if(wrap){const ps=[...wrap.children],W=wrap.clientWidth,pw=ps[0]?ps[0].offsetWidth:150,gap=W<420?10:16,per=Math.max(1,Math.floor((W+gap)/(pw+gap)));
    const ph=Math.max(...ps.map(p=>p.offsetHeight),180);
    ps.forEach((p,k)=>{p.style.setProperty("--gx",(k%per)*(pw+gap)+"px");p.style.setProperty("--gy",Math.floor(k/per)*(ph+gap)+"px")});
    wrap.style.setProperty("--ph",Math.ceil(ps.length/per)*(ph+gap)+"px")}
  requestAnimationFrame(()=>{const body=g.querySelector(".body");const need=32+(wrap?wrap.offsetTop+parseFloat(getComputedStyle(wrap).getPropertyValue("--ph"))+24:body.offsetHeight)-46;tray.style.setProperty("--lift",Math.max(need,60)+"px")});
}
function closeGuide(g){const wrap=g.querySelector(".papers");if(wrap)wrap.style.removeProperty("--ph")}
function wireGuides(){

}

    $("#imgCap").textContent=(n>1?`Image ${cur+1} of ${n}`:"")+(m.caption?(n>1?": ":"")+m.caption:"")+(okUrl(m.web)?((n>1||m.caption)?" · ":"")+"web copy shown"+(px?", "+px:""):((n>1||m.caption)?" · ":"")+"drawn placeholder, no image linked yet")+".";
    workEl.querySelectorAll(".th").forEach(b=>{const on=+b.dataset.k===cur;b.classList.toggle("on",on);b.setAttribute("aria-selected",on)})};
  workEl.querySelectorAll(".th").forEach(b=>b.addEventListener("click",()=>show(+b.dataset.k)));
  const pv=workEl.querySelector(".imgnav.prev"),nx=workEl.querySelector(".imgnav.next");
  if(pv){pv.addEventListener("click",()=>show(cur-1));nx.addEventListener("click",()=>show(cur+1))}
  show(0);
  return true;
}
function closeEntry(){workEl.classList.remove("on");workEl.innerHTML="";document.body.style.overflow=""}

function route(){
  if(!G)return;
  const h=location.hash.slice(1)||"cabinet";
  if(h.startsWith("work-")&&entry(h.slice(5)))return;
  closeEntry();lastView=h;
  const m=h.match(/^(drawer|designer|entity|movement|style|typo|kind)-(.+)$/);
  if(!m)cabinet();else if(m[1]==="drawer")drawer(m[2]);else nodePage(m[1],m[2]);
  scrollTo(0,0);
}
addEventListener("hashchange",route);
addEventListener("keydown",e=>{
  if(e.target.matches("input"))return;
  const h=location.hash.slice(1);
  if(e.key==="Escape"){if(workEl.classList.contains("on"))location.hash=lastView;else if(h&&h!=="cabinet")location.hash="cabinet"}
  if(workEl.classList.contains("on")&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const a=workEl.querySelectorAll(".fbar .btn")[e.key==="ArrowRight"?1:0];if(a)location.hash=a.getAttribute("href").slice(1)}
});

/* ---------- search ---------- */
const q=$("#q"),res=$("#res");
q.addEventListener("input",()=>{
  const v=q.value.trim().toLowerCase();if(!v||!G){res.innerHTML="";return}
  const hit=s=>String(s||"").toLowerCase().includes(v);
  const items=[];
  Object.values(G.D).filter(d=>hit(d.name)).slice(0,3).forEach(d=>items.push([`#designer-${slug(d.id)}`,"Designer",d.name,d.kind+" · "+d.years,["#f2d54a","#121212"]]));
  Object.values(G.E).filter(x=>hit(x.name)).slice(0,3).forEach(x=>items.push([`#entity-${slug(x.id)}`,"Client",x.name,x.type,["#ef9ab8","#121212"]]));
  G.order.filter(w=>[w.title,w.id,w.kind,w.subcategory,w.category,w.designStyle,w.typeStyle,w.movement,w.country,w.year,(G.E[w.entity]||{}).name,(G.D[w.designer]||{}).name].some(hit)).slice(0,8).forEach(w=>items.push([`#work-${w.key}`,w.id,w.title,w.kind+" · "+w.year,w.col]));
  res.innerHTML=items.length?items.map(i=>`<li><a href="${esc(i[0])}"><b style="background:${i[4][0]};color:${i[4][1]}">${esc(i[1])}</b><span>${esc(i[2])}</span><small>${esc(i[3])}</small></a></li>`).join(""):`<li class="none">Nothing filed under “${esc(q.value)}”.</li>`;
});
const clearQ=()=>{q.value="";res.innerHTML=""};
res.addEventListener("click",e=>{if(e.target.closest("a"))clearQ()});
q.addEventListener("keydown",e=>{if(e.key==="Escape"){clearQ();q.blur()}if(e.key==="Enter"){const a=res.querySelector("a");if(a){location.hash=a.getAttribute("href").slice(1);clearQ()}}});

/* ---------- load ---------- */
async function load(){
  let p=null,msg="";
  if(DATA_URL){try{const r=await fetch(DATA_URL,{cache:"no-store"});if(!r.ok)throw new Error(r.status);p=await r.json();msg=`Live from Google Sheets · updated ${new Date(p.updated).toLocaleString()}`}catch(err){msg="Couldn't read the Google Sheet feed, so these are the sample records. Check that the Apps Script web app is deployed with access set to Anyone."}}
  if(!p){p=SAMPLE;msg=msg||"Showing the 24 sample records from the Google Sheet. Images are drawn placeholders until scans are linked."}
  G=build(p);$("#src").textContent=msg;route();
}
load();
}
</script>
